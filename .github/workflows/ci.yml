name: PHP, Node.js, and Docker CI

permissions:
  contents: read

on:
  push:
    branches: [ 2.x ]
  pull_request:
    branches: [ 2.x ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  php-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ 8.4, 8.5 ] # See https://www.php.net/supported-versions.php
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    - name: Run Composer check
      run: vendor/bin/grumphp run --testsuite=composer
    - name: Run checks
      run: vendor/bin/grumphp run --testsuite=check
    - name: Run test suite
      run: vendor/bin/simple-phpunit

  symfony-lint-container:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: php bin/console lint:container
  symfony-lint-translations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [ ar_SA, bg_BG, de_DE, en, es_ES, fr_FR, hu_HU, it_IT, ja_JP, ko_KR, nl_NL, pl_PL, pt_BR, pt_PT, sl_SI, sq_AL, uk_UA, zh_CN, zh_TW ]
    steps:
    - uses: actions/checkout@v7
    - run: php bin/console lint:translations --locale=${{ matrix.locale }}
  symfony-lint-twig:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: php bin/console lint:twig templates/
  symfony-lint-xliff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: php bin/console lint:xliff translations/
  symfony-lint-yaml:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: php bin/console lint:yaml config/

  node-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 24.x ] # See https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - if: matrix.node-version != '18.x'
      run: npm run build
    - if: matrix.node-version == '18.x'
      run: NODE_OPTIONS=--openssl-legacy-provider npm run build
    - uses: actions/upload-artifact@v7
      with:
        name: assets-${{ matrix.node-version }}
        path: public/build
    # - run: npm test

  node-eslint:
    runs-on: ubuntu-latest
    needs: node-build
    steps:
    - uses: actions/checkout@v7
    - run: npm ci
    - run: npm run lint --if-present

  node-geojsonhint:
    runs-on: ubuntu-latest
    needs: node-build
    steps:
    - uses: actions/checkout@v7
    - run: npm ci
    - run: npm run geojsonhint --if-present

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
