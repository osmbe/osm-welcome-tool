name: osm-welcome-tool

services:
  symfony:
    container_name: symfony
    build: .
    ports:
      - 8080:80
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true

  postgresql:
    container_name: postgresql
    image: dhi.io/postgres:18-alpine3.22
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 30s

volumes:
  postgresql-data:
